name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/carbonate

  # The window is optional, but it should not be allowed to rot.
  #
  # Built in a Fedora container rather than on the runner directly: gotk4
  # calls GLib functions that Ubuntu's packages are too old to provide, so the
  # build fails there on missing symbols rather than on anything we wrote.
  gui:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and Go
        run: dnf install -y golang gcc glibc-devel gtk4-devel libadwaita-devel gobject-introspection-devel

      - name: Build the GUI
        run: CGO_ENABLED=1 go build -tags gtk ./cmd/carbonate-gui

  # The Flatpak is how most people will actually install carbonate, so a
  # manifest that stopped building would be found by a user rather than here.
  #
  # This is the same manifest Flathub builds, minus the source: there it comes
  # from a release tag, here from the checkout. Everything that can break —
  # the runtime version, the offline module list, the GTK build — is shared.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # flatpak-builder needs to set up its own sandbox, which it cannot do
      # from inside an unprivileged container.
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: carbonate.flatpak
          manifest-path: build/flatpak/io.github.develonrails.Carbonate.yml
          cache-key: flatpak-builder-${{ github.sha }}
