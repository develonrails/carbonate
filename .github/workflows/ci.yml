name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/carbonate

  # The window is optional, but it should not be allowed to rot.
  #
  # Built in a Fedora container rather than on the runner directly: gotk4
  # calls GLib functions that Ubuntu's packages are too old to provide, so the
  # build fails there on missing symbols rather than on anything we wrote.
  gui:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and Go
        run: dnf install -y golang gcc glibc-devel gtk4-devel gobject-introspection-devel

      - name: Build the GUI
        run: CGO_ENABLED=1 go build -tags gtk ./cmd/carbonate-gui
